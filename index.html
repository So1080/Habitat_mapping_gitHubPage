<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitat Interactive Study - Updated</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #1e1e1e; color: white; overflow: hidden; }
        #setup-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1e1e; z-index: 100; text-align: center; }
        #game-container { display: flex; width: 100vw; height: 100vh; }
        canvas, video { width: 50%; height: auto; border: 1px solid #444; object-fit: contain; }
        .btn { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #00caff; border: none; border-radius: 8px; font-weight: bold; margin: 10px; }
        #ui-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; }
        .hidden { display: none !important; }
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 30, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200; /* Stays above everything */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #444;
            border-top: 5px solid #00caff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-small { padding: 5px 10px; font-size: 14px; cursor: pointer; background: #444; color: white; border: none; border-radius: 4px; }
        #calib-panel {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8);
            padding: 15px; border-radius: 10px; display: none; z-index: 150;
        }
        .calib-row { margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-status">
            <div class="spinner"></div>
            <p>Loading Computer Vision AI...</p>
        </div>
        <button id="ready-btn" class="btn hidden" onclick="confirmReady()">ENTER STUDY</button>
    </div>

    <div id="setup-screen">
        <h1 id="menu-title">Habitat Sound Selection</h1>
        <div id="color-preview" style="width: 120px; height: 120px; margin: 20px; border: 3px solid white; border-radius: 10px;"></div>
        <p id="menu-instructions">Press [1, 2, 3] to preview sounds. Press [Enter] to confirm.</p>
        <div id="selection-status" style="margin-bottom: 20px; color: #00caff;"></div>
        <button class="btn" id="start-btn" class="hidden">BEGIN ACTIVITY</button>
    </div>

    <div id="calib-panel">
        <h3>Map Offset</h3>
        <div class="calib-row">
            <span>Horizontal:</span>
            <input type="range" id="off-x" min="-200" max="200" value="0" oninput="updateOffsets()">
        </div>
        <div class="calib-row">
            <span>Vertical:</span>
            <input type="range" id="off-y" min="-200" max="200" value="0" oninput="updateOffsets()">
        </div>
        <div class="calib-row">
            <span>Scale:</span>
            <input type="range" id="off-s" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateOffsets()">
        </div>
        <button class="btn-small" onclick="toggleCalibration()">Close</button>
    </div>

    <div id="game-container" class="hidden">
        <video id="input_video" style="display:none;"></video>
        <canvas id="cam_canvas"></canvas>
        <canvas id="map_canvas"></canvas>
        <div id="ui-bar">
            <span id="status-text">Detecting...</span>
            <button id="calib-btn" class="btn-small" onclick="toggleCalibration()">🔧 Calibrate</button>
            <button onclick="downloadCSV()" style="margin-left: 20px; cursor:pointer;">Download Logs</button>
        </div>
    </div>

    <script>
        console.log("Script execution started");



        // --- CONFIG & ASSETS (From Python script) ---
        const HABITATS = ["Sparse live bottom", "Dense live bottom", "Flat sand", "Rippled sand"];
        const UI_COLORS = { "Sparse live bottom": "#5FFEC9", "Dense live bottom": "#004434", "Flat sand": "#FE5954", "Rippled sand": "#FCE5B9" };
        
        // Match the specific naming conventions in your Python DESCRIPTIONS and SOUND_OPTIONS [cite: 4, 5, 6]
        const DESCRIPTIONS = {
            "Sparse live bottom": "sounds/Habitat_Legend-NarratorONLY-Sparse_Live_Bottom.wav",
            "Dense live bottom": "sounds/Habitat_Legend-NarratorONLY-Dense_Live_Bottom.wav",
            "Flat sand": "sounds/Habitat_Legend-NarratorONLY-Flat_Sand.wav",
            "Rippled sand": "sounds/Habitat_Legend-NarratorONLY-Rippled_Sand.wav"
        };

        let phase = "SELECTION";
        let currentHabIdx = 0;
        let selectedOptions = {}; // Stores { Habitat: OptionIndex } 
        let logs = []; // For CSV data collection 
        
        let activeAudio = null;
        let lastDetectedHabitat = null;

        let cvReady = false; // The library isn't ready yet

        // --- MASK PREPARATION (Pixel-Perfect Collision) ---
        const MAP_CONFIG = {
            11: { img: "craved_map2/Frame7_id9.png", mask: "craved_map2/Frame7_id9.png" },
            9:  { img: "craved_map2/Frame7_id9.png", mask: "craved_map2/Frame7_id9.png" },
            3:  { img: "craved_map3/Frame8_id8.png", mask: "craved_map3/Frame8_id8.png" },
            4:  { img: "map_6x4/map_6x4.jpeg",       mask: "map_6x4/map_6x4.jpeg" },
            27: { img: "map_coop_id20/map_coop_id20.png", mask: "map_coop_id20/map_coop_id20.png" }
        };

        const SOUND_OPTIONS = {
            "Sparse live bottom": [
                "Sounds_VF/BASIC_v3/BASIC-BASIC-sparse-live-8bars.wav",
                "Sounds_VF/COMPLEX/HabitatSynthSounds v4 C Short Loop - Sparse Live Bottom.wav",
                "Sounds_VF/SPEECH_US_v1/Sparse-100percent-USA_v1.aif"
            ],
            "Dense live bottom": [
                "Sounds_VF/BASIC_v3/BASIC-BASIC-dense-live-8bars-v3.wav",
                "Sounds_VF/COMPLEX/HabitatSynthSounds v4 C Short Loop - Dense Live Bottom.wav",
                "Sounds_VF/SPEECH_US_v1/Dense-100percent-USA_v1.aif"
            ],
            "Flat sand": [
                "Sounds_VF/BASIC_v3/BASIC-BASIC-flat-sand-8bars-v3.wav",
                "Sounds_VF/COMPLEX/HabitatSynthSounds v4 C Short Loop - Flat Sand.wav",
                "Sounds_VF/SPEECH_US_v1/Flat-100percent-USA_v1.aif"
            ],
            "Rippled sand": [
                "Sounds_VF/BASIC_v3/BASIC-BASIC-rippled-sand-8bars-v3.wav",
                "Sounds_VF/COMPLEX/HabitatSynthSounds v4 C Short Loop - Rippled Sand.wav",
                "Sounds_VF/SPEECH_US_v1/Rippled-100percent-USA_v1.aif"
            ]
            
        };

        let last_marker_id = null;
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

        // --- GLOBAL STATE ---
        let homographyMatrix = null;
        let maskLoaded = false;

        // INITIALIZATION FIX: Lock internal resolution immediately
        maskCanvas.width = 640;
        maskCanvas.height = 480;
        const maskImg = new Image();

        maskImg.onload = () => {
            maskLoaded = true;
            // We force the context to draw the new mask as soon as it loads
            maskCtx.clearRect(0, 0, 640, 480);
            maskCtx.drawImage(maskImg, 0, 0, 640, 480);
            console.log("Collision Mask Updated for ID:", last_marker_id);
        };


        function onOpenCvReady() {
            cvReady = true;
            console.log("OpenCV is fully loaded and ready!");
            // Hide the loading overlay so the user can see the Selection menu
            document.getElementById('loading-status').classList.add('hidden');
            document.getElementById('ready-btn').classList.remove('hidden');
        }

        function confirmReady() {
            // This click "unlocks" audio for the browser
            document.getElementById('loading-overlay').classList.add('hidden');
            updateMenu(); // Now the first narrator sound will actually play!
        }

        let calibration = { x: 0, y: 0, scale: 1.0 };
        let calibMode = false;

        function toggleCalibration() {
            calibMode = !calibMode;
            document.getElementById('calib-panel').style.display = calibMode ? 'block' : 'none';
        }

        function updateOffsets() {
            calibration.x = parseInt(document.getElementById('off-x').value);
            calibration.y = parseInt(document.getElementById('off-y').value);
            calibration.scale = parseFloat(document.getElementById('off-s').value);
        }

        

        function updateMenu() {
            const hab = HABITATS[currentHabIdx];
            document.getElementById('menu-title').innerText = `Select Sound: ${hab}`;
            document.getElementById('color-preview').style.backgroundColor = UI_COLORS[hab];
            
            // Show current selection status
            const currentSelection = selectedOptions[hab];
            document.getElementById('selection-status').innerText = 
                currentSelection !== undefined ? `Current: Option ${currentSelection + 1}` : "No sound selected yet";
            
            // Hide start button until the very end validation
            document.getElementById('start-btn').classList.add('hidden');
            
            playSound(DESCRIPTIONS[hab]); // Auto-play narrator 
        }

        window.addEventListener('keydown', (e) => {
            if (phase === "SELECTION") {
                const hab = HABITATS[currentHabIdx];
                const key = e.key.toLowerCase();

                if (key === "r" && activeAudio) {
                    activeAudio.pause();
                }
                
                if (["1", "2", "3"].includes(key)) {
                    const optionIdx = parseInt(key) - 1;
                    selectedOptions[hab] = optionIdx;
                    playSound(SOUND_OPTIONS[hab][optionIdx]);
                }

                if (key === "enter") {
                    if (selectedOptions[hab] !== undefined) {
                        if (currentHabIdx < HABITATS.length - 1) {
                            currentHabIdx++;
                            updateMenu();
                        } else {
                            const allSelected = HABITATS.every(h => selectedOptions[h] !== undefined);
                            if (allSelected) {
                                // --- FIX: STOP AUDIO ONCE DONE ---
                                if (activeAudio) activeAudio.pause();
                                
                                document.getElementById('start-btn').classList.remove('hidden');
                                document.getElementById('menu-instructions').innerText = "All habitats configured.";
                            }
                        }
                    }
                }
            }
        });

        

        // --- DATA LOGGING  ---
        function logInteraction(habitat, choice) {
            logs.push({
                timestamp: new Date().toLocaleString(),
                habitat: habitat,
                choice: choice
            });
        }

        function downloadCSV() {
            let csv = "Timestamp,Habitat,Choice\n";
            logs.forEach(row => { csv += `${row.timestamp},${row.habitat},${row.choice}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `study_log_${Date.now()}.csv`);
            a.click();
        }

        // --- COMPUTER VISION ACTIVITY ---

        function playSound(file, loop = false) {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.src = ""; // Clear the old source
            }
            
            activeAudio = new Audio(file);
            activeAudio.loop = loop;
            
            // Explicitly play and handle the promise
            const playPromise = activeAudio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error("Playback failed. This usually means a click was required first:", error);
                    // If it fails, we try to play it again on the very next click
                    window.addEventListener('click', () => { activeAudio.play(); }, { once: true });
                });
            }
        }

        function playSound_old(file, loop = false) {
            if (activeAudio) activeAudio.pause();
            activeAudio = new Audio(file);
            activeAudio.loop = loop;
            activeAudio.play().catch(e => console.log("Audio block", e));
        }

        const videoElement = document.getElementById('input_video');
        const camCanvas = document.getElementById('cam_canvas');
        const mapCanvas = document.getElementById('map_canvas');
        const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });
        const mapCtx = mapCanvas.getContext('2d');
        const mapImg = new Image();
        mapImg.src = 'craved_map1.jpeg';

        

        function startActivity() {
            phase = "ACTIVITY";
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            // FIX: Removed 'const' here. We use the global maskCanvas/maskCtx defined at the top.
            maskCanvas.width = 640; 
            maskCanvas.height = 480;

            if (maskImg.complete && maskImg.naturalWidth > 0) {
                maskCtx.drawImage(maskImg, 0, 0, 640, 480);
            }

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });
            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    if (videoElement.readyState >= 2) {
                        await hands.send({image: videoElement}); 
                    }
                },
                width: 640, height: 480
            });
            camera.start();
        }

        function drawCalibrationOverlay(ctx) {
            if (!homographyMatrix || !cvReady) return;

            try {
                let invHomography = new cv.Mat();
                cv.invert(homographyMatrix, invHomography);

                const corners = [{x:0, y:0}, {x:640, y:0}, {x:640, y:480}, {x:0, y:480}];
                ctx.beginPath();
                ctx.strokeStyle = "#00ffff"; // Cyan box
                ctx.lineWidth = 4;

                for (let i = 0; i < corners.length; i++) {
                    let ptData = new Float32Array([corners[i].x, corners[i].y]);
                    let pt = cv.matFromArray(1, 1, cv.CV_32FC2, ptData);
                    let camPt = new cv.Mat();
                    
                    cv.perspectiveTransform(pt, camPt, invHomography);
                    
                    let px = camPt.data32F[0];
                    let py = camPt.data32F[1];

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);

                    pt.delete(); camPt.delete();
                }
                ctx.closePath();
                ctx.stroke();
                invHomography.delete();
            } catch (e) { /* Ignore transient math errors */ }
        }

        function onResults(results) {
            console.log("MediaPipe is sending frames");
            if (camCanvas.width !== 640) camCanvas.width = 640;
            if (camCanvas.height !== 480) camCanvas.height = 480;

            camCtx.save();
            camCtx.clearRect(0, 0, 640, 480);
            camCtx.drawImage(results.image, 0, 0, 640, 480);
            
            // 1. Process Marker Detection first
            if (cvReady) {
                try { detectMarkers(results.image); } 
                catch (err) { console.warn("Marker Error:", err); }
            }

            // 2. Marker UI Feedback
            if (homographyMatrix) {
                drawCalibrationOverlay(camCtx);
                
                // DRAW "MARKER FOUND" TEXT
                camCtx.fillStyle = "#00FF00";
                camCtx.font = "bold 20px Arial";
                camCtx.fillText("✔ MARKER DETECTED (ID: " + last_marker_id + ")", 20, 40);
            } else {
                camCtx.fillStyle = "#FF0000";
                camCtx.fillText("✘ NO MARKER", 20, 40);
            }

            if (mapImg.complete && mapImg.naturalWidth > 0) {
                mapCtx.clearRect(0, 0, 640, 480);
                mapCtx.drawImage(mapImg, 0, 0, 640, 480);
            }

            // 3. Hand Tracking & Collision
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const x = results.multiHandLandmarks[0][8].x * 640;
                const y = results.multiHandLandmarks[0][8].y * 480;
                drawPointer(camCtx, x, y, "lime");
                drawPointer(mapCtx, x, y, "magenta");
                
                // Safety check for collision
                if (homographyMatrix && maskLoaded) {
                    processCollision(x, y);
                }
            } else {
                if (activeAudio && activeAudio.loop) activeAudio.pause();
                lastDetectedHabitat = null;
            }
            camCtx.restore();
        }

        

        function drawPointer(ctx, x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function processCollision(fingerX, fingerY) {
            // 1. Safety Checks: Only run if homography and mask context exist
            if (!homographyMatrix || !maskCtx || !maskLoaded) return;

            let srcPtData = new Float32Array([fingerX, fingerY]);
            let pt = cv.matFromArray(1, 1, cv.CV_32FC2, srcPtData);
            let transformedPt = new cv.Mat();

            try {
                cv.perspectiveTransform(pt, transformedPt, homographyMatrix);

                // 2. Round coordinates to nearest Integer for getImageData
                let mapX = Math.round(transformedPt.data32F[0]);
                let mapY = Math.round(transformedPt.data32F[1]);

                // 3. Check bounds before reading pixels
                if (mapX >= 0 && mapX < 640 && mapY >= 0 && mapY < 480) {
                    const pixel = maskCtx.getImageData(mapX, mapY, 1, 1).data;
                    const rgb = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
                    
                    const colorMap = {
                        "rgb(95,254,201)": "Sparse live bottom",
                        "rgb(0,68,52)": "Dense live bottom",
                        "rgb(254,89,84)": "Flat sand",
                        "rgb(252,229,185)": "Rippled sand"
                    };

                    let detected = colorMap[rgb]; 

                    if (detected && detected !== lastDetectedHabitat) {
                        const choice = (selectedOptions[detected] || 0) + 1;
                        playSound(`sounds/${detected.replace(/ /g, "_")}_option${choice}.wav`, true);
                        document.getElementById('status-text').innerText = `Habitat: ${detected}`;
                        logInteraction(detected, choice);
                        lastDetectedHabitat = detected;
                    }
                }
            } catch (e) {
                console.error("Collision calculation error:", e);
            } finally {
                // Essential cleanup
                pt.delete(); 
                transformedPt.delete();
            }
        }


        document.getElementById('start-btn').onclick = startActivity;
        let arucoDict = null;
        let arucoParams = null;
        let detector = null;
        let arucoRefine = null;
        

        function detectMarkers(videoFrame) {
            console.log("Looking for markers...");
            
            // Safety check for OpenCV readiness
            if (!cvReady) {
                console.log("Detection skipped: OpenCV not ready");
                return;
            }

            // if (!arucoDict) arucoDict = cv.getPredefinedDictionary(cv.DICT_APRILTAG_36h11);cv.DICT_4X4_50
            if (!arucoDict) arucoDict = cv.getPredefinedDictionary(cv.DICT_4X4_50);
            if (!arucoParams) {
                try {
                    arucoParams = new cv.aruco_DetectorParameters();
                } catch (e) {
                    arucoParams = cv.aruco_DetectorParameters();
                }
                arucoParams.adaptiveThreshWinSizeMin = 3;
                arucoParams.adaptiveThreshWinSizeMax = 23;
                arucoParams.adaptiveThreshWinSizeStep = 10;
            }

            if (!arucoRefine) {
                arucoRefine = new cv.aruco_RefineParameters(10.0, 3.0, true);
            }

            if (!detector) {
                // Match the documentation: cv::aruco::ArucoDetector detector(dictionary, detectorParams);
                detector = new cv.aruco_ArucoDetector(arucoDict, arucoParams, arucoRefine);
            }

            let mat = cv.imread(document.getElementById('cam_canvas'));
            let gray = new cv.Mat();
            cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY, 0);
            console.log("gray ok");

            let ids = new cv.Mat();
            let cornersList = new cv.MatVector();
            let rejectedPoints = new cv.MatVector();

            detector.detectMarkers(gray, cornersList, ids, rejectedPoints);

            try {
                // cv.detectMarkers(gray, arucoDict, cornersList, ids, arucoParams, rejectedPoints);
                // cv.aruco_detectMarkers(gray, arucoDict, cornersList, ids, arucoParams, rejectedPoints);
                console.log("Markers detected:", ids.rows);
                

                if (ids.rows > 0) {
                    let id = ids.data32S[0];
                    // Access corners from MatVector
                    let markerCorners = cornersList.get(0);
                    
                    // ... your calibration and homography logic ...
                    console.log("Marker Detected ID:", id);
                    
                    // Logic for mapping (matching your snippet)
                    let calib_pts = null;
                    if ([0, 3, 9, 11].includes(id)) {
                        let size = (id !== 11) ? 490 : 277;
                        calib_pts = [640-size, 0, 640, 0, 640, size, 640-size, size];
                    } else if ([4, 21].includes(id)) {
                        calib_pts = [640-344, 30, 640-42, 30, 640-42, 338, 640-344, 338];
                    }

                    if (calib_pts) {
                        let offset_pts = calib_pts.map((val, idx) => {
                            if (idx % 2 === 0) return (val * calibration.scale) + calibration.x;
                            return (val * calibration.scale) + calibration.y;
                        });
                        let dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, offset_pts);
                        
                        if (homographyMatrix) homographyMatrix.delete();
                        homographyMatrix = cv.findHomography(markerCorners, dstPts);
                        dstPts.delete();
                    }

                    if (MAP_CONFIG[id] && id !== last_marker_id) {
                        last_marker_id = id;
                        maskLoaded = false;
                        mapImg.src = MAP_CONFIG[id].img;
                        maskImg.src = MAP_CONFIG[id].mask;
                    }
                }

            } catch (err) {
                console.error("Internal Marker Error:", err);
            } finally {
                // 5. ESSENTIAL: Delete EVERYTHING to prevent memory-related silent crashes
                if (mat) mat.delete();
                if (gray) gray.delete();
                if (ids) ids.delete();
                if (cornersList) cornersList.delete();
                if (rejectedPoints) rejectedPoints.delete();
                // if (parameters) parameters.delete();
                // Dictionary is a pointer to a static object, usually doesn't need deletion
            }
        }

        


    </script>
</body>
</html>
